name = "nora-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# One Durable Object per room holds that room's live state.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects run on the Cloudflare free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
